services:
  app:
    image: docker.io/ntrloc/ntrloc:1.0.0   # update once an actual version is published
    ports: ["8080:8080"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ntrloc
      DB_USER: ntrloc
      DB_PASSWORD: ntrloc
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ntrloc
      POSTGRES_PASSWORD: ntrloc
      POSTGRES_DB: ntrloc
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntrloc -d ntrloc"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  pgdata:
