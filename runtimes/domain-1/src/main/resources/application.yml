server:
  port: 9090

spring:
  application:
    name: domain-1
  datasource:
    url: jdbc:postgresql://localhost:5432/ntrloc
    username: ntrloc
    password: ntrloc
    driver-class-name: org.postgresql.Driver

ntrloc:
  auth:
    local:
      enabled: true
    oauth:
      enabled: false
    ldap:
      enabled: false
  security:
    enabled: true
    seed-local-accounts: true
    seed-test-data: false

binary:
  storage:
    strategy: block
    block:
      location: target/storage-temp
      autocreate: true

logging:
  level:
    root: info
