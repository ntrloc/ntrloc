server:
  port: 9090

spring:
  application:
    name: domain-1
  web:
    resources:
      # Spring Boot's own default static-resource handler otherwise serves classpath:/static/**
      # (which includes the admin-ui, physically under .../static/admin-ui/) at the URL root,
      # ambiently exposing it at /admin-ui/** with none of graph.ui.mounts' caching, SPA fallback,
      # or SecurityConfig's "/admin/**" hasRole("ADMIN") check -- /admin is the one intended path.
      add-mappings: false
  datasource:
    url: jdbc:postgresql://localhost:5432/ntrloc
    username: ntrloc
    password: ntrloc
    driver-class-name: org.postgresql.Driver

cluster:
  name: domain-1

graph:
  branding:
    display-name: domain-1
  auth:
    local:
      enabled: true
    oauth:
      enabled: false
    ldap:
      enabled: false
  security:
    enabled: true
    seed-local-accounts: true
    seed-test-data: false
  ui:
    mounts:
      - path: /admin
        location: "file:///Users/michaelcoddington/Documents/Projects/ntrloc/domain-graph-starter/src/main/resources/static/admin-ui/"
      # Experimental React admin UI (ntrloc-admin-ui) -- served from its own build output, not
      # copied anywhere, so `npm run build` there is the only step needed to refresh it here.
      # Matches vite.config.js's base: '/react-admin/' for the production build.
      - path: /react-admin
        location: "file:///Users/michaelcoddington/Documents/Projects/ntrloc/ntrloc-admin-ui/dist/"
  process:
    script:
      # Packages a process script (Groovy or JavaScript) can reference a class from by simple
      # name, e.g. "new SingleItemProjectionSpec(...)" instead of the fully-qualified name.
      import-packages:
        - org.ntrloc.graph.projection
        - org.ntrloc.graph.mutation
  telemetry:
    # Set true to actually transmit OTel traces/metrics/logs (e.g. to a local Grafana stack).
    enabled: false

binary:
  storage:
    strategy: block
    block:
      location: target/storage-temp
      autocreate: true

logging:
  level:
    root: info
