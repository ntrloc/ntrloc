server:
  port: 9090

spring:
  application:
    name: domain-1
  datasource:
    url: jdbc:postgresql://localhost:5432/ntrloc
    username: ntrloc
    password: ntrloc
    driver-class-name: org.postgresql.Driver

cluster:
  name: domain-1

graph:
  branding:
    display-name: domain-1
  auth:
    local:
      enabled: true
    oauth:
      enabled: false
    ldap:
      enabled: false
  security:
    enabled: true
    seed-local-accounts: true
    seed-test-data: false
  ui:
    mounts:
      - path: /admin
        location: "file:///Users/michaelcoddington/Documents/Projects/ntrloc/domain-graph-starter/src/main/resources/static/admin-ui/"
  process:
    script:
      # Packages a process script (Groovy or JavaScript) can reference a class from by simple
      # name, e.g. "new SingleItemProjectionSpec(...)" instead of the fully-qualified name.
      import-packages:
        - org.ntrloc.graph.db.projection
        - org.ntrloc.graph.db.mutation
  telemetry:
    # Set true to actually transmit OTel traces/metrics/logs (e.g. to a local Grafana stack).
    enabled: false

binary:
  storage:
    strategy: block
    block:
      location: target/storage-temp
      autocreate: true

logging:
  level:
    root: info
