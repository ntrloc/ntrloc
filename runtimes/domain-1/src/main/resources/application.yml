server:
  port: 9090

spring:
  application:
    name: domain-1
  # spring.servlet.multipart.enabled=false (BinaryController.upload needs the raw, unconsumed
  # request body) is no longer set here -- domain-graph-starter's own
  # BinaryUploadMultipartEnvironmentPostProcessor now forces it for every application built on
  # it, not just this one. Explicitly NOT re-declared here, so this file can't accidentally drift
  # from, or look like a model to copy for, the thing that's now actually enforced one level down.
  web:
    resources:
      # Spring Boot's own default static-resource handler otherwise serves classpath:/static/**
      # (which includes the admin-ui, physically under .../static/admin-ui/) at the URL root,
      # ambiently exposing it at /admin-ui/** with none of graph.ui.mounts' caching, SPA fallback,
      # or SecurityConfig's "/admin/**" hasRole("ADMIN") check -- /admin is the one intended path.
      add-mappings: false
  datasource:
    url: jdbc:postgresql://localhost:5432/ntrloc
    username: ntrloc
    password: ntrloc
    driver-class-name: org.postgresql.Driver
    # Hikari's defaults, made explicit: the pool size is the real limit on concurrent database work.
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30s
  # Virtual threads for request handling and Spring's own task executors. Off until a load test
  # shows they help: every request then competes directly for the database pool below, which
  # Tomcat's 200-thread cap otherwise shields it from. The test suite runs with them on.
  threads:
    virtual:
      enabled: false

cluster:
  name: domain-1

graph:
  branding:
    display-name: domain-1
  auth:
    local:
      enabled: true
    oauth:
      enabled: false
    ldap:
      enabled: false
  security:
    seed-local-accounts: true
    seed-test-data: false
  ui:
    mounts:
      - path: /admin
        location: "file:///Users/michaelcoddington/Documents/Projects/ntrloc/domain-graph-starter/src/main/resources/static/admin-ui/"
      # Experimental React admin UI (ntrloc-admin-ui) -- genuinely bundled into
      # domain-graph-starter's own jar now (see that module's pom.xml: frontend-maven-plugin runs
      # ntrloc-admin-ui's npm build, maven-resources-plugin copies dist/ into this module's own
      # classpath resources), not served from an external file:// path -- refreshing it needs a
      # domain-graph-starter rebuild, not just `npm run build` in ntrloc-admin-ui. Matches
      # vite.config.js's base: '/admin-react/' for the production build.
      - path: /admin-react
        location: "classpath:/static/admin-react/"
  process:
    script:
      # Packages a process script (Groovy or JavaScript) can reference a class from by simple
      # name, e.g. "new SingleItemProjectionSpec(...)" instead of the fully-qualified name.
      import-packages:
        - org.ntrloc.graph.projection
        - org.ntrloc.graph.mutation
  telemetry:
    # Set true to actually transmit OTel traces/metrics/logs (e.g. to a local Grafana stack).
    enabled: false

binary:
  storage:
    strategy: block
    block:
      location: target/storage-temp
      autocreate: true

logging:
  level:
    root: info
