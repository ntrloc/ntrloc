server:
  port: 10090

spring:
  application:
    name: domain-2
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        protocol: stateless
  thymeleaf:
    prefix: classpath:/sites/admin/templates/
  web:
    resources:
      add-mappings: false

management:
  health:
    cassandra:
      enabled: false
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

graph:
  domainName: domain-2
  management:
    resource.location: file:///Users/michaelcoddington/Documents/Projects/ntrloc/domain-graph-starter/src/main/resources/org/ntrloc/graph/ui

binary:
  storage:
    strategy: block
    block:
      location: target/storage-temp
      autocreate: true

logging:
  level:
    root: info