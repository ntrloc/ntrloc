<h2 mat-dialog-title>Save Changes</h2>

<mat-dialog-content>
  <div class="change-group" *ngFor="let group of data.summary">
    <div class="group-label">{{ group.label }}</div>
    <ul class="change-list">
      <li *ngFor="let change of group.changes">{{ change }}</li>
    </ul>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="confirm()">Save Changes</button>
</mat-dialog-actions>
