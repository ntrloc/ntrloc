<div class="schema-editor-layout">
  <aside class="item-list-panel">
    <app-item-list
      [items]="schema?.items ?? []"
      [selectedItem]="selectedItem"
      (itemSelected)="onItemSelected($event)">
    </app-item-list>
  </aside>
  <main class="item-detail-panel">
    <app-item-detail [item]="selectedItem" [propertyTypes]="propertyTypes"></app-item-detail>
  </main>
</div>
