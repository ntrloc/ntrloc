server:
  port: 8080

spring:
  application:
    name: ntrloc
  servlet:
    multipart:
      # BinaryController.upload needs the raw, unconsumed request body (parsed itself via
      # JakartaServletFileUpload's streaming API) -- see the dependency's own comment in pom.xml.
      enabled: false
  web:
    resources:
      # Spring Boot's own default static-resource handler otherwise serves classpath:/static/**
      # (which includes the admin-ui, physically under .../static/admin-ui/) at the URL root,
      # ambiently exposing it at /admin-ui/** with none of graph.ui.mounts' caching, SPA fallback,
      # or SecurityConfig's "/admin/**" hasRole("ADMIN") check -- /admin is the one intended path.
      add-mappings: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ntrloc}
    username: ${DB_USER:ntrloc}
    password: ${DB_PASSWORD:ntrloc}
    driver-class-name: org.postgresql.Driver
    # Hikari's defaults, made explicit: the pool size is the real limit on concurrent database work.
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30s
  # Virtual threads for request handling and Spring's own task executors. Off until a load test
  # shows they help: every request then competes directly for the database pool below, which
  # Tomcat's 200-thread cap otherwise shields it from. The test suite runs with them on.
  threads:
    virtual:
      enabled: false

cluster:
  name: ${CLUSTER_NAME:ntrloc}

graph:
  branding:
    display-name: ntrloc
  auth:
    local:
      enabled: true
    oauth:
      enabled: false
    ldap:
      enabled: false
  security:
    seed-local-accounts: true
    seed-test-data: false
  ui:
    mounts:
      - path: /admin
        location: "classpath:/static/admin-ui/"

binary:
  storage:
    strategy: block
    block:
      location: ${BINARY_STORAGE_LOCATION:/tmp/ntrloc-storage}
      autocreate: true

logging:
  level:
    root: info
