<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <title>NTRLOC</title>

        <script src="/jquery/jquery.js"></script>
        <script src="/jquery/jquery-ui.min.js"></script>
        <script src="/textInput.js"></script>
        <script src="/htmx/htmx.min.js"></script>
        <link rel="stylesheet" href="/jquery/jquery-ui.min.css">
        <link rel="stylesheet" href="/jquery/jquery-ui.theme.min.css">
        <link rel="stylesheet" href="/css/ntrloc-ui.css">

        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: black;
                font-family: sans-serif;
            }
            #main {
                position: absolute;
                display: flex;
                flex-direction: column;
                left: 0;
                right: 0;
                top: 0;
                bottom: 0;

                > #header {
                    display: flex;
                    flex-direction: row;
                    column-gap: 10px;
                    align-items: center;
                    height: 70px;
                    > img {
                        max-height: 100%;
                    }

                    .headerNav {
                        padding: 10px;
                        border: solid 1px var(--ntrloc-form-decoration-color);
                        border-radius: 5px;
                        align-content: center;

                        a {
                            color: white;
                        }
                    }
                }

                > #content {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    padding: 0;
                    margin: 0;
                    border-radius: 0;
                    min-height: 0;
                    background: none;
                    color: white;

                }
            }
        </style>
    </head>
    <body>
        <div id="main">
            <div id="header">
                <img src="/images/ntrloc-logo-horizontal.png"/>
                <div class="headerNav"><a href="/search">Search</a></div>
                <div class="headerNav"><a href="/schema">Schema</a></div>
                <div class="headerNav"><a href="explorer.html">Explorer</a></div>
            </div>
            <div id="content">
                <div layout:fragment="content">
                    <!-- Default content or empty placeholder -->
                </div>
            </div>
        </div>
    </body>
</html>
