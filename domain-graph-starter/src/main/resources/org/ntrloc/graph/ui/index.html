<html>
    <head>

        <script src="jquery/jquery.js"></script>
        <script src="jquery/jquery-ui.min.js"></script>
        <script src="textInput.js"></script>
        <script src="htmx/htmx.min.js"></script>
        <link rel="stylesheet" href="jquery/jquery-ui.min.css">
        <link rel="stylesheet" href="jquery/jquery-ui.theme.min.css">
        <link rel="stylesheet" href="css/ntrloc-ui.css">

        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: black;
            }
            #main {
                position: absolute;
                display: flex;
                flex-direction: column;
                left: 0;
                right: 0;
                top: 0;
                bottom: 0;

                > #header {
                    height: 70px;
                    > img {
                        max-height: 100%;
                    }
                }

                > #tabs {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    padding: 0;
                    margin: 0;
                    border-radius: 0;
                    min-height: 0;
                    background: none;

                    > ul {
                        flex: 0;
                    }

                    > div {
                        padding: 20px;
                        border: none;
                        margin: 0px;
                        flex: 1;
                        display: flex;
                        min-height: 0;
                    }
                }
            }
        </style>

        <script>
            $(document).ready(function() {
                $( "#tabs" ).tabs();
            })
        </script>
    </head>

    <body>
        <div id="main">
            <div id="header">
                <img src="images/ntrloc-logo-horizontal.png"/>
            </div>
            <div id="tabs">
                <ul>
                    <li><a href="schemaEditor.html">Schema Editor</a></li>
                    <li><a href="#explorer-tab">Explorer</a></li>
                    <li><a href="#gremlin-console-tab">Gremlin Console</a></li>
                </ul>
                <div id="explorer-tab">
                    Explorer
                </div>
                <div id="gremlin-console-tab">
                    Gremlin console
                </div>
            </div>
        </div>
    </body>
</html>
