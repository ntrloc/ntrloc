<html  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{/layout.html}">
    <head>
        <style>
            #searchContent {
                font-size: 2em;
            }
        </style>
        <base href="/search/"/>
        <script>
            function search() {
                let searchObject = `
                {
                  Photo {
                        properties {
                            name
                            number
                        }
                  }
                }
                `;
                window.location.href = "/search/execute?searchObject=" + encodeURIComponent(searchObject) + "&page=1";
            }
        </script>
    </head>
    <body>
        <div id="searchContent" layout:fragment="content">
            <p>I AM REAL SEARCH YO</p>

            <button onclick="search()">Search</button>
        </div>
    </body>
</html>
