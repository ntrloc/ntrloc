<html  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{/layout.html}">
    <head>
        <base href="/schema/"/>
        <style>
            #schemaContent {
                flex: 1;
                display: flex;
                flex-direction: row;
                min-height: 0;

                .names {
                    display: flex;
                    flex-direction: column;
                    flex: 25%;
                    padding:0;
                    min-width: 400px;

                    > .typesTab {
                        min-height: 0;
                        padding: 0;
                        margin: 0;
                        border-radius: 0;
                        border: none;
                        flex: 1;
                        display: flex;
                        flex-direction: column;
                        background: none;

                        > ul {
                            flex: 0;
                            background: none;
                            border: none;
                        }

                        > div {
                            flex: 1;
                            min-height: 0;
                            overflow: scroll;
                            display: flex;
                            flex-direction: column;
                            align-items: stretch;
                        }

                        #items-tab {
                            display: flex;
                            flex-direction: row;
                            border: 1px solid #666666;
                            padding: 0px;

                            #items-list {
                                flex: 25%;
                                display: flex;
                                flex-direction: column;
                                padding: 30px;
                                row-gap: 20px;

                                hr {
                                    width: 100%;
                                    border: none;
                                    height: 1px;
                                    background-color: #666666;
                                }
                            }

                            .vertical-rule {
                                flex: 0;
                                min-width: 1px;
                                width: 1px;
                                background-color: #666666;
                            }

                            #items-editor {
                                display: flex;
                                flex-direction: column;
                                flex: 75%;
                                padding: 30px;
                                row-gap: 10px;
                            }


                        }

                        #links-tab {

                            display: flex;
                            flex-direction: row;
                            border: 1px solid #666666;
                            padding: 0px;

                            #links-list {
                                flex: 25%;
                                display: flex;
                                flex-direction: column;
                                padding: 30px;
                                row-gap: 20px;

                                hr {
                                    width: 100%;
                                    border: none;
                                    height: 1px;
                                    background-color: #666666;
                                }
                            }

                            .vertical-rule {
                                flex: 0;
                                min-width: 1px;
                                width: 1px;
                                background-color: #666666;
                            }

                            #links-editor {
                                display: flex;
                                flex-direction: column;
                                flex: 75%;
                                padding: 30px;
                                row-gap: 10px;
                            }


                        }

                        .item {
                            padding: 10px;
                            border: 1px solid #444444;
                            font-weight: bold;
                            background-color: #222222;
                            border-radius: 10px;
                            cursor: pointer;
                        }
                    }
                }


            }
        </style>
    </head>
    <body>
        <div id="schemaContent" layout:fragment="content">
            <div class="names">
                <div class="typesTab">
                    <ul>
                        <li><a href="/schema#items-tab">Items</a></li>
                        <li><a href="/schema#links-tab">Links</a></li>
                    </ul>
                    <div id="items-tab">
                        <div id="items-list">
                            <button id="newItemType" class="ui-priority-primary" hx-trigger="click"  hx-target="#items-editor" hx-get="item/new" hx-swap="innerHTML">New item type</button>
                            <hr/>

                            <div class="item" th:each="def: ${schemaManager.retrieveItemDefinitions()}" th:text="${def.name}" th:attr="hx-get=|item/${def.name}/fields|" hx-trigger="click" hx-target="#items-editor" hx-swap="innerHTML"></div>
                        </div>

                        <div class="vertical-rule"></div>

                        <div id="items-editor"></div>
                    </div>
                    <div id="links-tab">
                        <div id="links-list">
                            <button class="ui-priority-primary">New link type</button>
                            <hr/>

                            <div class="item" th:each="def: ${schemaManager.retrieveLinkDefinitions()}" th:utext="| ${def.sourceItemType} &#8594; ${def.sourceLabel} &#8594; ${def.targetItemType} |"></div>
                        </div>
                        <div class="vertical-rule"></div>
                        <div id="links-editor"></div>
                    </div>
                </div>
            </div>

            <script>
                $( ".typesTab" ).tabs();
                $("button").button();

                htmx.process("#items-tab");
            </script>
        </div>

    </body>
</html>
