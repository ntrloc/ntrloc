<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{/layout.html}">
    <head>
        <style>
            #searchContent {
                display: flex;
                flex-direction: row;
                min-height: 0;
                flex: 1;

                #searchOptions {
                    min-width: 250px;
                }

                #searchOutput {
                    flex: 1;
                    display: flex;
                    flex-direction: column;

                    #searchResults {
                        padding: 20px;
                        min-height: 0;
                        flex: 1;
                        display: grid;
                        grid-gap: 20px;
                        grid-auto-rows: min-content;
                        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                        overflow-y: auto;

                        .result {
                            border: solid 1px #666666;
                            display: flex;
                            flex-direction: column;
                            padding: 10px;
                            border-radius: 10px;
                            cursor: pointer;

                            .resultType {
                                background-color: var(--ntrloc-form-decoration-color);
                                color: white;
                                font-weight: bold;
                                border-radius: 5px;
                                align-self: flex-start;
                                padding: 5px;
                                margin-bottom: 20px;

                                &[data-itemtype="Photographer"] {
                                    background-color: darkgreen;
                                }
                            }

                            .properties {
                                display: grid;
                                grid-template-columns: minmax(50px, 1fr) 2fr;
                                column-gap: 10px;
                                row-gap: 5px;
                                margin-bottom: 20px;

                                .propertyName {
                                    font-weight: bold;
                                    color: var(--ntrloc-form-decoration-color);
                                }

                                .propertyValue {
                                    text-overflow: ellipsis;
                                }
                            }

                            .resultId {
                                margin-top: auto;
                                color: #666666;
                                font-size: 0.8em;
                            }
                        }
                    }
                }

            }
        </style>
        <base href="/search/"/>
        <script>
            function search() {
                let searchObject = `
                {
                  Photo {
                        itemType
                        id
                        version
                        properties {
                            name
                            number
                        }
                  }
                  Photographer {
                        itemType
                        id
                        version
                        properties {
                            name
                        }
                  }
                }
                `.replace(/\s+/g, " ");
                window.location.href = "/search/execute?searchObject=" + encodeURIComponent(searchObject) + "&page=1";
            }
        </script>
    </head>
    <body>
        <div id="searchContent" layout:fragment="content"> <!-- /* Render this section in the main layout */-->

            <div id="searchOptions">
                <button id="searchButton" onclick="search()">Search</button>

                <button id="itemTypesToggle">Item Type</button>
                <div id="itemTypesMenu" style="display:none">
                    <div id="itemTypesMenuContent" style="display: flex; flex-direction: column;">
                        <div class="itemTypeChoice">
                            <input type="checkbox" id="Photo" name="Photo" value="Photo"><label for="Photo">Photo</label>
                        </div>
                        <div class="itemTypeChoice">
                            <input type="checkbox" id="Photographer" name="Photographer" value="Photographer"><label for="Photographer">Photographer</label>
                        </div>
                    </div>
                </div>
            </div>

            <div id="searchOutput">
                <div id="searchResults">
                    <div class="result" th:each="def: ${searchResults}">
                        <div class="resultType" th:attr="data-itemType=${def.itemType}" th:text="${def.itemType}"></div>
                        <div class="properties">

                            <th:block th:each="prop: ${def.properties}">
                                <span class="propertyName" th:text="${prop.key}"></span>
                                <span class="propertyValue" th:text="${prop.value}"></span>
                            </th:block>

                            <span class="propertyName">version</span>
                            <span class="propertyValue" th:text="${def.version}"></span>
                        </div>

                        <span class="resultId" th:text="${def.id}"></span>

                    </div>
                </div>

                <div th:if="${elapsedSeconds}" class="message">[['Search executed in ' +  ${elapsedSeconds} + ' seconds']]</div>
            </div>

            <script>
                $("#searchButton").button();
                function showHide() {
                    $( "#itemTypesMenu" ).toggle( "slide", {direction: "up"}, 200 );
                }
                $("#itemTypesToggle").on( "click", showHide);
                $(".result").on("click", function () {
                    const id = $(this).attr('data-id');
                    window.location.href = "/item/" + encodeURIComponent(id);
                });
            </script>

        </div>
    </body>
</html>
