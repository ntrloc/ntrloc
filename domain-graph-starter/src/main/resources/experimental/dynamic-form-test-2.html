<html>
    <head>

        <style>
            body {
                background-color: #0f1419;
                color: white;
            }
        </style>

        <!--
        <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
        -->
        <script src="explorer/alpinejs-3.js" defer></script>
        <script src="schema-editor-2.js"></script>
        <script>
            const testData1 = {
                name: "Photo",
                description: "A photograph",
                propertyGroups: [
                    {
                        id: null,
                        name: null,
                        isNamedGroup: false,
                        properties: [
                            { id: 'abc1', name: 'colorspace', type:'STRING', description: 'The colorspace of a photo' },
                            { id: 'abc2', name: 'createdDate', type:'DATETIME', description: 'The date/time a photo was taken' },
                            { id: 'abc3', name: 'photoName', type:'STRING', description: 'The name of a photo' }
                        ]
                    },
                    {
                        id: 'group1',
                        name: 'Titles',
                        properties: [
                            { id: 'asdf', name: 'title1', type:'STRING', description: 'title 1' },
                            { id: 'asdf', name: 'title2', type:'STRING', description: 'title 2' }
                        ]
                    }
                ],
                links: [
                    {
                        name: "creator",
                        relatedType: "Photographer",
                        inverseName: "createdPhoto"
                    },
                    {
                        name: "relatedPhotos",
                        relatedType: "Photo",
                        inverseName: "relatedPhotos"
                    }
                ]
            };

            const testData2 = {
                name: "Photographer",
                description: "A person who takes photos",
                propertyGroups: [
                    {
                        id: null,
                        name: null,
                        isNamedGroup: false,
                        properties: [
                            { id: 'photog1', name: 'first name', type:'STRING', description: 'First name' },
                            { id: 'photog2', name: 'last name', type:'STRING', description: 'Last name' }
                        ]
                    },
                    {
                        id: 'group2',
                        name: 'Ages',
                        properties: [
                            { id: 'asdf', name: 'age1', type:'STRING', description: 'age 1' }
                        ]
                    }
                ],
                links: [
                    {
                        name: "createdPhoto",
                        relatedType: "Photo",
                        inverseName: "creator"
                    },
                    {
                        name: "employer",
                        relatedType: "Agency",
                        inverseName: "employs"
                    }
                ]
            };

            const testData3 = {

            };

            document.addEventListener('alpine:init', () => {
                editor = new SchemaEditor();
            });

            function loadTestData1() {
                editor.load(testData1);
            }
            function loadTestData2() {
                editor.load(testData2);
            }
            function loadTestData3() {
                editor.load(testData3);
            }

        </script>

    </head>
    <body>

        <div x-data="editor" x-html="getTemplate()"></div>

        <div style="margin-top: 20px; font-size: 1.2em;">
            Things to do:
            <ol>
                <li>Mark a group as deleted without deleting it (like properties)</li>
                <li>Revert group delete</li>
                <li>Save editor changes</li>
                <li>Undo editor changes</li>
                <li>Prompt before loading data while unsaved changes are present</li>
                <li>Keep groups and properties alphabetized</li>
                <li>Display group description</li>
            </ol>
        </div>

        <button x-data @click="loadTestData1()">Load Photo</button>
        <button x-data @click="loadTestData2()">Load Photographer</button>
        <button x-data @click="loadTestData2()">Load Photographer->Photo link</button>

    </body>
</html>
