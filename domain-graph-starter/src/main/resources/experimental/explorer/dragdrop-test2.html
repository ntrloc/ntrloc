<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Viewer</title>
    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
        }
        #canvas {
            border: 1px solid #ccc;
            background: #f9f9f9;
        }
    </style>
</head>
<body>
<h2>Item Viewer</h2>
<svg id="canvas" width="1200" height="600">
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="black" />
        </marker>
    </defs>
</svg>

<script>
    // ============== DATA MODEL ==============

    class ItemType {
        constructor(name, color) {
            this.name = name;
            this.color = color;
        }
    }

    class Item {
        constructor(id, type, properties, displayProperty) {
            this.id = id;
            this.type = type; // ItemType instance
            this.properties = properties; // Object with property name-value pairs
            this.displayProperty = displayProperty; // Name of the property to display when collapsed
            this.links = []; // Array of {targetItemId, label}
        }

        addLink(targetItemId, label) {
            this.links.push({ targetItemId, label });
        }

        getDisplayValue() {
            return this.properties[this.displayProperty] || '';
        }
    }

    class ItemModel {
        constructor() {
            this.items = new Map(); // id -> Item
            this.itemTypes = new Map(); // type name -> ItemType
        }

        addItemType(itemType) {
            this.itemTypes.set(itemType.name, itemType);
        }

        addItem(item) {
            this.items.set(item.id, item);
        }

        getItem(id) {
            return this.items.get(id);
        }

        getAllItems() {
            return Array.from(this.items.values());
        }
    }

    // ============== VIEW MODEL ==============

    class ItemView {
        constructor(item, x, y, width = 200) {
            this.item = item;
            this.x = x;
            this.y = y;
            this.width = width;
            this.headerHeight = 30;
            this.collapsedBodyHeight = 50; // Space for display property + toggle
            this.propertyLineHeight = 20; // Height per property line
            this.paddingTop = 20; // Padding before first property
            this.paddingBottom = 25; // Padding for toggle button
            this.expanded = false;

            // SVG elements (will be created by renderer)
            this.svgGroup = null;
            this.headerRect = null;
            this.bodyRect = null;
            this.headerText = null;
            this.bodyText = null;
            this.toggleButton = null;
        }

        get height() {
            if (this.expanded) {
                const numProperties = Object.keys(this.item.properties).length;
                return this.headerHeight + this.paddingTop +
                    (numProperties * this.propertyLineHeight) + this.paddingBottom;
            } else {
                return this.headerHeight + this.collapsedBodyHeight;
            }
        }

        get centerX() {
            return this.x + this.width / 2;
        }

        get centerY() {
            return this.y + this.height / 2;
        }

        toggle() {
            this.expanded = !this.expanded;
        }

        // Find intersection point with rectangle edge (same logic as before)
        getEdgePoint(targetX, targetY) {
            const dx = targetX - this.centerX;
            const dy = targetY - this.centerY;

            if (dx === 0 && dy === 0) {
                return { x: this.centerX, y: this.centerY };
            }

            const halfWidth = this.width / 2;
            const halfHeight = this.height / 2;

            let t = Infinity;

            if (dx > 0) {
                t = Math.min(t, halfWidth / dx);
            }
            if (dx < 0) {
                t = Math.min(t, -halfWidth / dx);
            }
            if (dy > 0) {
                t = Math.min(t, halfHeight / dy);
            }
            if (dy < 0) {
                t = Math.min(t, -halfHeight / dy);
            }

            return {
                x: this.centerX + t * dx,
                y: this.centerY + t * dy
            };
        }
    }

    // ============== RENDERER ==============

    class ItemRenderer {
        constructor(svg, itemModel) {
            this.svg = svg;
            this.itemModel = itemModel;
            this.itemViews = new Map(); // item id -> ItemView
            this.linkElements = []; // Array of line elements

            this.selectedView = null;
            this.dragOffset = { x: 0, y: 0 };

            // Set up event listeners
            this.svg.addEventListener('mousedown', this.handleMouseDown.bind(this));
            document.addEventListener('mousemove', this.handleMouseMove.bind(this));
            document.addEventListener('mouseup', this.handleMouseUp.bind(this));
        }

        addItemView(itemView) {
            this.itemViews.set(itemView.item.id, itemView);
        }

        render() {
            // Clear existing content
            while (this.svg.childNodes.length > 1) { // Keep the <defs> element
                if (this.svg.lastChild.tagName !== 'defs') {
                    this.svg.removeChild(this.svg.lastChild);
                } else {
                    break;
                }
            }
            this.linkElements = [];

            // Draw all links first (so they appear behind items)
            this.drawLinks();

            // Draw all items
            this.itemViews.forEach(view => this.drawItem(view));
        }

        drawLinks() {
            this.itemViews.forEach(sourceView => {
                sourceView.item.links.forEach(link => {
                    const targetView = this.itemViews.get(link.targetItemId);
                    if (targetView) {
                        this.drawLink(sourceView, targetView, link.label);
                    }
                });
            });
        }

        drawLink(sourceView, targetView, label) {
            const edge1 = sourceView.getEdgePoint(targetView.centerX, targetView.centerY);
            const edge2 = targetView.getEdgePoint(sourceView.centerX, sourceView.centerY);

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", edge1.x);
            line.setAttribute("y1", edge1.y);
            line.setAttribute("x2", edge2.x);
            line.setAttribute("y2", edge2.y);
            line.setAttribute("stroke", "#666");
            line.setAttribute("stroke-width", "2");
            line.setAttribute("marker-end", "url(#arrowhead)");
            this.svg.appendChild(line);
            this.linkElements.push(line);

            // Draw label
            if (label) {
                const midX = (edge1.x + edge2.x) / 2;
                const midY = (edge1.y + edge2.y) / 2;

                const dx = edge2.x - edge1.x;
                const dy = edge2.y - edge1.y;
                let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                // Flip text if it would be upside-down
                if (angle > 90 || angle < -90) {
                    angle += 180;
                }

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", midX);
                text.setAttribute("y", midY - 5);
                text.setAttribute("font-size", "12");
                text.setAttribute("fill", "#666");
                text.setAttribute("font-weight", "bold");
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("transform", `rotate(${angle}, ${midX}, ${midY})`);
                text.textContent = label;
                this.svg.appendChild(text);
            }
        }

        drawItem(view) {
            const headerHeight = 30;

            // Create group for this item
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            view.svgGroup = group;

            // Draw header rectangle
            const headerRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            headerRect.setAttribute("x", view.x);
            headerRect.setAttribute("y", view.y);
            headerRect.setAttribute("width", view.width);
            headerRect.setAttribute("height", headerHeight);
            headerRect.setAttribute("fill", view.item.type.color);
            headerRect.setAttribute("stroke", "black");
            headerRect.setAttribute("stroke-width", "2");
            headerRect.setAttribute("cursor", "move");
            headerRect.setAttribute("data-item-id", view.item.id);
            headerRect.setAttribute("data-is-header", "true");
            group.appendChild(headerRect);
            view.headerRect = headerRect;

            // Draw body rectangle
            const bodyRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            bodyRect.setAttribute("x", view.x);
            bodyRect.setAttribute("y", view.y + headerHeight);
            bodyRect.setAttribute("width", view.width);
            bodyRect.setAttribute("height", view.height - headerHeight);
            bodyRect.setAttribute("fill", "white");
            bodyRect.setAttribute("stroke", "black");
            bodyRect.setAttribute("stroke-width", "2");
            bodyRect.setAttribute("cursor", "move");
            bodyRect.setAttribute("data-item-id", view.item.id);
            group.appendChild(bodyRect);
            view.bodyRect = bodyRect;

            // Draw header text (type name)
            const headerText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            headerText.setAttribute("x", view.x + view.width / 2);
            headerText.setAttribute("y", view.y + headerHeight / 2 + 5);
            headerText.setAttribute("font-size", "14");
            headerText.setAttribute("font-weight", "bold");
            headerText.setAttribute("fill", "white");
            headerText.setAttribute("text-anchor", "middle");
            headerText.setAttribute("pointer-events", "none");
            headerText.textContent = view.item.type.name;
            group.appendChild(headerText);
            view.headerText = headerText;

            // Draw body text (properties)
            if (view.expanded) {
                // Show all properties
                let yOffset = view.y + view.headerHeight + view.paddingTop;
                Object.entries(view.item.properties).forEach(([key, value]) => {
                    const propText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    propText.setAttribute("x", view.x + 10);
                    propText.setAttribute("y", yOffset);
                    propText.setAttribute("font-size", "12");
                    propText.setAttribute("fill", "black");
                    propText.setAttribute("pointer-events", "none");

                    const keySpan = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
                    keySpan.setAttribute("font-weight", "bold");
                    keySpan.textContent = key;
                    propText.appendChild(keySpan);

                    const valueSpan = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
                    valueSpan.textContent = ` ${value}`;
                    propText.appendChild(valueSpan);

                    group.appendChild(propText);
                    yOffset += view.propertyLineHeight;
                });
            } else {
                // Show only display property
                const bodyText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                bodyText.setAttribute("x", view.x + view.width / 2);
                bodyText.setAttribute("y", view.y + headerHeight + (view.height - headerHeight) / 2 + 5);
                bodyText.setAttribute("font-size", "14");
                bodyText.setAttribute("fill", "black");
                bodyText.setAttribute("text-anchor", "middle");
                bodyText.setAttribute("pointer-events", "none");
                bodyText.textContent = view.item.getDisplayValue();
                group.appendChild(bodyText);
                view.bodyText = bodyText;
            }

            // Draw toggle button (triangle)
            const toggleButton = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            const btnCenterX = view.x + view.width / 2;
            const btnY = view.y + view.height - 15;

            if (view.expanded) {
                // Up arrow
                toggleButton.setAttribute("points", `${btnCenterX-6},${btnY+3} ${btnCenterX+6},${btnY+3} ${btnCenterX},${btnY-3}`);
            } else {
                // Down arrow
                toggleButton.setAttribute("points", `${btnCenterX-6},${btnY-3} ${btnCenterX+6},${btnY-3} ${btnCenterX},${btnY+3}`);
            }

            toggleButton.setAttribute("fill", "#666");
            toggleButton.setAttribute("cursor", "pointer");
            toggleButton.setAttribute("data-item-id", view.item.id);
            toggleButton.setAttribute("data-is-toggle", "true");
            group.appendChild(toggleButton);
            view.toggleButton = toggleButton;

            this.svg.appendChild(group);
        }

        handleMouseDown(e) {
            const target = e.target;
            const itemId = target.getAttribute('data-item-id');

            if (!itemId) return;

            const isToggle = target.getAttribute('data-is-toggle') === 'true';

            if (isToggle) {
                // Toggle expand/collapse
                const view = this.itemViews.get(itemId);
                if (view) {
                    view.toggle();
                    this.render();
                }
            } else {
                // Start dragging
                const view = this.itemViews.get(itemId);
                if (view) {
                    this.selectedView = view;
                    this.dragOffset.x = e.clientX - view.x;
                    this.dragOffset.y = e.clientY - view.y;
                }
            }
        }

        handleMouseMove(e) {
            if (this.selectedView) {
                this.selectedView.x = e.clientX - this.dragOffset.x;
                this.selectedView.y = e.clientY - this.dragOffset.y;
                this.render();
            }
        }

        handleMouseUp() {
            this.selectedView = null;
        }
    }

    // ============== SETUP AND DEMO ==============

    // Create item types
    const photographerType = new ItemType("Photographer", "#5f9ea0");
    const photoType = new ItemType("Photo", "#daa520");

    // Create item model
    const itemModel = new ItemModel();
    itemModel.addItemType(photographerType);
    itemModel.addItemType(photoType);

    // Create items
    const photographer = new Item(
        "photographer1",
        photographerType,
        { Name: "Dave Smith", Age: 30 },
        "Name"
    );

    const photo = new Item(
        "photo1",
        photoType,
        { filename: "photo1.jpg" },
        "filename"
    );

    const photo2 = new Item(
        "photo2",
        photoType,
        { filename: "photo2.jpg" },
        "filename"
    );

    // Add link
    photographer.addLink("photo1", "createdPhoto");
    photographer.addLink("photo2", "createdPhoto");

    // Add items to model
    itemModel.addItem(photographer);
    itemModel.addItem(photo);
    itemModel.addItem(photo2);

    // Create renderer
    const svg = document.getElementById('canvas');
    const renderer = new ItemRenderer(svg, itemModel);

    // Create views
    const photographerView = new ItemView(photographer, 100, 100);
    const photoView = new ItemView(photo, 500, 150);
    const photo2View = new ItemView(photo2, 500, 100);

    renderer.addItemView(photographerView);
    renderer.addItemView(photoView);
    renderer.addItemView(photo2View);

    // Initial render
    renderer.render();
</script>
</body>
</html>
