<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>

        <script type="module">
            import {GraphExplorer} from "./graph-explorer.js";

            document.addEventListener('alpine:init', () => {
                Alpine.data('explorer', () => new GraphExplorer());
            });

        </script>

        <script src="alpinejs-3.js" defer></script>
        <script type="module" src="graph-explorer.js"></script>

        <style>
            body {
                padding: 0px;
                margin: 0px;
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                bottom: 0;

                #explorer {
                    width: 100%;
                    height: 100%;
                }
            }
        </style>
    </head>

    <body>
        <div id="explorer" x-data="explorer" x-html="getTemplate()"></div>
    </body>

</html>
