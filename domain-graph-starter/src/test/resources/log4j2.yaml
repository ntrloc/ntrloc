Configuration:

  Properties:
    Property:
      name: log-path
      value: logs

  Appenders:
    Console:
      name: Console_Appender
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS}{America/New_York} %highlight{%-5level}{FATAL=red, ERROR=red, WARN=yellow, INFO=green, DEBUG=blue} [%t] %C{1}.%M(%F:%L) - %msg%n"

  Loggers:
    Root:
      level: WARN
      AppenderRef:
        - ref: Console_Appender
    logger:
      - name: org.ntrloc
        level: INFO
      - name: org.janusgraph.graphdb.database.management
        level: WARN
      - name: org.janusgraph.diskstorage.lucene
        level: DEBUG
      - name: org.apache.lucene
        level: DEBUG