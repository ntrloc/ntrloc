spring:
  # The whole suite runs on virtual threads, so it doubles as their compatibility check; the
  # runtimes keep them off until load-tested (see their application.yml).
  threads:
    virtual:
      enabled: true

cluster:
  name: graph-test

graph:
  security:
    seed-test-data: true
    secret-key: Sghf3zoi5J8HWMXMLRrt3pfmY28x6gFncKH+qVW+iEM=
  ui:
    mounts:
      # The vanilla-JS admin UI at the same /admin path the release runtime mounts it, so tests
      # exercise SecurityConfig's /admin/** admin-only rule against real pages.
      - path: /admin
        location: "classpath:/static/admin-ui/"
      # Istanbul-instrumented React admin UI build for the Selenium tests (AbstractUiIntegrationTest);
      # relative to this module's directory, the working directory under Maven.
      - path: /admin-react
        location: "file:../ntrloc-admin-ui/target/dist-coverage/"

binary:
  storage:
    strategy: block
    block:
      location: target/test-binary-storage
      autocreate: true

logging:
  level:
    root: warn
    # The server's half of a live schema update, for a failed UI test's output: the schema changing,
    # its event reaching connected pages, and pages connecting and disconnecting.
    org.ntrloc.graph.db.partition.schema.SchemaManager: info
    org.ntrloc.graph.events: debug
